name: Dev Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache bundled mlx-vlm server distribution
        uses: actions/cache@v4
        with:
          path: |
            dist/mlx-vlm-server
            .cache/python-build-standalone
          key: mlx-vlm-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('PythonDistribution/**') }}

      - name: Cache Swift package dependencies
        uses: actions/cache@v4
        with:
          path: build/XcodeDerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Build app (unsigned Debug)
        run: make xcode-build

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/NativDevelopmentDerivedData/Build/Products/Debug/Nativ.app Nativ-dev.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Nativ-dev
          path: Nativ-dev.zip
          if-no-files-found: error
