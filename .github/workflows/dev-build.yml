name: Dev Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache bundled mlx-vlm server distribution
        uses: actions/cache@v4
        with:
          path: |
            dist/mlx-vlm-server
            .cache/python-build-standalone
          key: mlx-vlm-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('PythonDistribution/**') }}

      - name: Cache Swift package dependencies
        uses: actions/cache@v4
        with:
          path: build/XcodeDerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Test and build app (unsigned Debug)
        run: |
          xcodegen generate
          xcodebuild \
            -project Nativ.xcodeproj \
            -scheme Nativ \
            -configuration Debug \
            -derivedDataPath build/NativDevelopmentDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Zip app
        run: |
          cd build/NativDevelopmentDerivedData/Build/Products/Debug
          zip -r -y "$GITHUB_WORKSPACE/Nativ-dev.zip" Nativ.app

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nativ-dev
          path: Nativ-dev.zip
